# Server-side deployment for a single Hetzner host.
#
# Pulls the published image and never builds Outline. The image is produced by
# the `Build and publish image` GitHub Actions workflow on every push to main;
# compiling on a 2 GB server will exhaust its memory.
#
# The only build here is the small Caddy image, which exists solely to add the
# Cloudflare DNS plugin needed for wildcard certificates.
#
# Deploy:
#
#   scp -r deploy docker-compose.hetzner.yml root@<host>:/root/outline/
#   scp .env.production root@<host>:/root/outline/.env
#   ssh root@<host> 'cd /root/outline && docker compose -f docker-compose.hetzner.yml up -d --build'
#
# Pin the deployed revision with OUTLINE_TAG in `.env`. Unset falls back to
# `latest`, which moves on every push to main.
#
# `watchtower` closes the last gap: without it, a new `latest` image sitting
# in GHCR never reaches this host until someone SSHes in and runs
# `docker compose pull && up -d` by hand. It polls GHCR on WATCHTOWER_POLL_INTERVAL,
# and only recreates containers labeled `com.centurylinklabs.watchtower.enable`
# (just `outline` below) so `redis` and `caddy` are never bounced by it.
services:
  redis:
    image: redis:7
    restart: unless-stopped
    user: "redis:redis"
    # Bull queues and collaboration state live in Redis. Persisting it means a
    # container restart does not drop queued jobs such as pending invite emails.
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  outline:
    image: ghcr.io/tin-wizard/outline:${OUTLINE_TAG:-latest}
    restart: unless-stopped
    # The image's entrypoint applies pending database migrations before the
    # server starts, so a rollback to an older tag needs no migration of its
    # own. Keep this service at a single replica: two containers starting at
    # once would race on the migration table, which has no cross-process lock.
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    # Loopback only. Caddy is the sole public entry point; publishing this on
    # 0.0.0.0 would expose an unencrypted port that bypasses TLS and any
    # proxy-level protection.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Uploaded attachments when FILE_STORAGE=local. Back this directory up.
      - outline-data:/var/lib/outline/data
    logging: *logging
    labels:
      # Opts this container into watchtower's auto-update polling below.
      - "com.centurylinklabs.watchtower.enable=true"

  caddy:
    build: ./deploy/caddy
    restart: unless-stopped
    depends_on:
      - outline
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3
      - "443:443/udp"
    environment:
      # Interpolated by compose from `.env` in this directory. Kept explicit
      # rather than using env_file so the database and app secrets are not
      # injected into the proxy container.
      CF_API_TOKEN: ${CF_API_TOKEN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      # /data holds the ACME account key and issued certificates. Losing it
      # forces re-issuance and risks hitting Let's Encrypt rate limits.
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  mattermost-relay:
    # Translates Outline's signed webhook payloads into Mattermost Incoming
    # Webhook messages. See deploy/mattermost-relay/server.js for the format
    # mismatch this bridges and the signature verification it performs.
    build: ./deploy/mattermost-relay
    restart: unless-stopped
    environment:
      # Only per-workspace webhook secrets and the shared Mattermost URL are
      # passed through - not the full .env - since this container doesn't
      # need database credentials or app secrets. Add one line here and one
      # entry to deploy/mattermost-relay/server.js's TEAMS map per workspace.
      OUTLINE_WEBHOOK_SECRET: ${OUTLINE_WEBHOOK_SECRET}
      PROGRAMMING_OUTLINE_SECRET: ${PROGRAMMING_OUTLINE_SECRET}
      MATTERMOST_WEBHOOK_URL: ${MATTERMOST_WEBHOOK_URL}
    logging: *logging

  healthwatch:
    # Polls container health and site uptime, alerting the
    # Outline-critical-alerts Mattermost channel on state changes only. See
    # deploy/healthwatch/monitor.js.
    build: ./deploy/healthwatch
    restart: unless-stopped
    volumes:
      # Read-only, same as watchtower below - only needs to list container
      # state, never start/stop/exec anything.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CRITICAL_ALERTS_WEBHOOK_URL: ${CRITICAL_ALERTS_WEBHOOK_URL}
    logging: *logging

  watchtower:
    # containrrr/watchtower is unmaintained and hardcodes a Docker API version
    # (1.25) below what modern Docker Engine accepts (this host: 1.52).
    # nickfedor/watchtower is the maintained continuation of the same project.
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    volumes:
      # ghcr.io/tin-wizard/outline is a public package: no registry
      # credentials exist on this host (confirmed no /root/.docker/config.json)
      # and none are needed for watchtower to pull it either.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
    logging: *logging

volumes:
  redis-data:
  outline-data:
  caddy-data:
  caddy-config:
